<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qwertzio - Destansı Türkçe Öğren</title>
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #46a302;
            --secondary: #1cb0f6;
            --secondary-dark: #1899d6;
            --bg: #ffffff;
            --text: #3c3c3c;
            --gray-light: #f1f1f1;
            --gray-border: #e5e5e5;
            --gray-text: #afafaf;
            --danger: #ff4b4b;
            --gold: #ffc800;
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body { 
            margin: 0; padding: 0; 
            background-color: #dae3e7; 
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        #app { 
            background: var(--bg); width: 100%; max-width: 450px; 
            height: 100%; position: relative; overflow: hidden; 
            display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
        }

        .screen { 
            display: none; flex: 1; padding: 20px; padding-bottom: 80px; 
            flex-direction: column; align-items: center; overflow-y: auto;
            position: absolute; top: 60px; bottom: 0; width: 100%; left: 0;
            background: var(--bg);
        }
        
        #screen-register { top: 0; z-index: 100; justify-content: center; }
        .screen.active { display: flex; }

        .top-bar { 
            position: absolute; top: 0; left: 0; width: 100%; height: 60px;
            padding: 0 20px; display: flex; justify-content: space-between; 
            align-items: center; background: white; z-index: 90; 
            border-bottom: 2px solid var(--gray-border); 
        }
        
        .top-bar .left-actions { display: flex; align-items: center; gap: 15px; }
        .top-bar .back-btn { font-size: 1.5rem; cursor: pointer; color: var(--gray-text); display: none; }

        .stat { 
            font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; 
            gap: 6px; background: var(--gray-light); padding: 6px 12px;
            border-radius: 12px; border: 1px solid var(--gray-border);
        }
        .lives { color: var(--danger); }
        .streak { color: #ff9600; }
        .level-indicator { color: var(--secondary); }

        h1, h2, h3 { color: var(--text); margin: 10px 0; text-align: center;}
        .qwertzio-title { color: var(--primary); font-size: 2.8rem; font-weight: 900; margin-bottom: 5px; }
        .subtitle { color: var(--gray-text); font-size: 1rem; margin-bottom: 25px; font-weight: 600; text-align: center; }

        input[type="text"] { 
            width: 100%; padding: 16px; margin: 10px 0; border: 2px solid var(--gray-border); 
            border-radius: 16px; font-size: 1.1rem; outline: none; background: #fafafa;
        }
        input[type="text"]:focus { border-color: var(--secondary); background: #fff; }

        button { 
            width: 100%; padding: 16px; margin: 12px 0; border: none; 
            border-radius: 16px; font-size: 1.1rem; font-weight: bold; 
            cursor: pointer; color: white; text-transform: uppercase;
            transition: transform 0.1s;
        }
        .btn-green { background-color: var(--primary); box-shadow: 0 5px 0 var(--primary-dark); }
        .btn-green:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--primary-dark); }
        .btn-blue { background-color: var(--secondary); box-shadow: 0 5px 0 var(--secondary-dark); }
        .btn-blue:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--secondary-dark); }

        .platform-btn { background: #fff; color: var(--text); border: 2px solid var(--gray-border); box-shadow: 0 4px 0 var(--gray-border); text-transform: none;}
        .platform-btn.selected { border-color: var(--secondary); background: #e3f2fd; box-shadow: 0 4px 0 var(--secondary-dark); }

        .path-container { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 24px; }
        .level-node { width: 80px; height: 80px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 1.4rem; color: white; cursor: pointer; position: relative; }
        .level-node:nth-child(4n+1) { transform: translateX(-40px); }
        .level-node:nth-child(4n+2) { transform: translateX(0px); }
        .level-node:nth-child(4n+3) { transform: translateX(40px); }
        .level-node:nth-child(4n+4) { transform: translateX(0px); }
        .level-node.unlocked { background: var(--primary); box-shadow: 0 6px 0 var(--primary-dark); }
        .level-node.locked { background: #e5e5e5; box-shadow: 0 6px 0 #cccccc; color: #999999; }
        .level-node .tooltip { position: absolute; bottom: -25px; background: #333; color: white; font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }

        .quiz-header { width: 100%; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .progress-container { flex: 1; height: 16px; background: var(--gray-border); border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--primary); border-radius: 10px; transition: width 0.3s ease; }
        .question-title { font-size: 1.2rem; font-weight: 700; margin: 15px 0; text-align: center; color: var(--text); }

        .options-container { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .option-card { background: white; border: 2px solid var(--gray-border); border-radius: 16px; padding: 16px; font-size: 1.1rem; font-weight: 600; cursor: pointer; box-shadow: 0 3px 0 var(--gray-border); }
        .option-card:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gray-border); }

        .match-container { display: flex; gap: 10px; width: 100%; }
        .match-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .match-btn { background: white; border: 2px solid var(--gray-border); padding: 12px 5px; border-radius: 12px; text-transform: none; font-size: 0.95rem; font-weight: 600; color: var(--text); box-shadow: 0 3px 0 var(--gray-border); margin: 0;}
        .match-btn.selected { background: #e3f2fd; border-color: var(--secondary); box-shadow: 0 3px 0 var(--secondary-dark); }
        .match-btn.matched { background: var(--gray-light); color: transparent; border-color: transparent; box-shadow: none; pointer-events: none; }
        .match-btn.error { background: #ffebeb; border-color: var(--danger); box-shadow: 0 3px 0 var(--danger); animation: shake 0.3s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

        .input-area { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .input-area textarea { width: 100%; height: 100px; padding: 15px; border: 2px solid var(--gray-border); border-radius: 16px; font-size: 1.1rem; outline: none; resize: none; }
        .input-area textarea:focus { border-color: var(--secondary); }

        .timer-warning { color: var(--danger); font-weight: 700; margin: 10px 0; font-size: 0.9rem; background: #ffebeb; padding: 8px 16px; border-radius: 12px; display: none; }
        
        #notification-area { position: absolute; top: 70px; right: 15px; width: 250px; display: flex; flex-direction: column; gap: 8px; z-index: 200; pointer-events: none; }
        .persistent-toast { background: var(--secondary); color: white; padding: 10px 15px; border-radius: 12px; font-weight: bold; font-size: 0.85rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px; pointer-events: auto; animation: slideIn 0.3s forwards; transition: opacity 0.5s; }
        @keyframes slideIn { from { transform: translateX(120%); } to { transform: translateX(0); } }
        .persistent-toast.faded { opacity: 0; }

        .teaching-card { background: #fff8e1; border: 3px solid var(--gold); border-radius: 16px; padding: 30px; text-align: center; width: 100%; margin-top: 20px; box-shadow: 0 6px 0 var(--gold); }
        .teaching-title { font-size: 1.2rem; color: #d4a000; font-weight: bold; margin-bottom: 10px; }
        .teaching-text { font-size: 1.3rem; font-weight: 700; color: #333; line-height: 1.4; }

        .speaker-btn { background: none; border: none; font-size: 2rem; cursor: pointer; margin: 5px auto; display: block; box-shadow: none; width: auto; color: #58cc02; }
    </style>
</head>
<body>

<div id="app">
    <div id="notification-area"></div>

    <div id="main-top-bar" class="top-bar">
        <div class="left-actions">
            <span id="back-arrow" class="back-btn" onclick="goBackToDashboard()">←</span>
            <div class="stat level-indicator">🏆 <span id="user-display-level">B. 1</span></div>
        </div>
        <div style="display: flex; gap: 8px;">
            <div class="stat streak">🔥 <span id="streak-count">0</span></div>
            <div class="stat lives">❤️ <span id="lives-count">5</span></div>
        </div>
    </div>

    <!-- 1. GİRİŞ EKRANI -->
    <div id="screen-register" class="screen active">
        <div style="font-size: 4rem;">⛺</div>
        <div class="qwertzio-title">Qwertzio</div>
        <div class="subtitle">Eski Anadolu Türkçesi</div>
        
        <div style="width: 100%; margin-top: 10px;">
            <label style="font-weight: 700; color: var(--text);">Adın nedir yiğidim?</label>
            <input type="text" id="reg-name" placeholder="Örn: Ertuğrul">
            
            <label style="font-weight: 700; color: var(--text); display: block; margin-top: 20px; margin-bottom: 10px;">Obaya nereden katılıyorsun?</label>
            <div style="display: flex; gap: 10px;">
                <button class="platform-btn" id="btn-web" onclick="selectPlatform('web')">🌐 Web Sitesi</button>
                <button class="platform-btn" id="btn-app" onclick="selectPlatform('app')">📱 Uygulama</button>
            </div>
        </div>
        
        <button class="btn-green" id="auth-btn" style="margin-top: 30px;" onclick="handleAuth()">Toyu Başlat</button>
    </div>

    <!-- 2. DASHBOARD -->
    <div id="screen-dashboard" class="screen">
        <h3 id="welcome-banner" style="text-align: center; margin-top: 10px; width: 100%;">Sefalar Getirdin!</h3>
        <p style="color: var(--gray-text); font-weight: 600; margin: 0 0 15px 0; font-size: 0.9rem; text-align: center;">Öğrenmek istediğin destansı bölümü seç:</p>
        
        <div id="dashboard-timer-warning" class="timer-warning">
            ⚠️ Can tükenmiş! Yeni can dolumuna kalan: <span id="dashboard-time-left">00:30</span>
        </div>

        <div class="path-container" id="nodes-path-container"></div>
    </div>

    <!-- 3. ÖĞRETİ EKRANI -->
    <div id="screen-teaching" class="screen">
        <div class="quiz-header"><span style="font-weight: bold; color: var(--gray-text);">Bunu Belliyesin!</span></div>
        <div class="teaching-card">
            <div class="teaching-title">Kuralımız:</div>
            <div class="teaching-text" id="teaching-content-text">Yükleniyor...</div>
            <button class="speaker-btn" onclick="replayTeachingVoice()">🔊</button>
        </div>
        <button class="btn-blue" style="margin-top: auto;" onclick="proceedToQuestion()">Belleğime Kazıdım</button>
    </div>

    <!-- 4. QUIZ EKRANI -->
    <div id="screen-quiz" class="screen">
        <div class="quiz-header">
            <div class="progress-container"><div id="quiz-progress-bar" class="progress-bar"></div></div>
            <span id="quiz-q-counter" style="font-weight: bold; color: var(--gray-text);">1/3</span>
        </div>
        <button class="speaker-btn" onclick="replayQuestionVoice()">🔊</button>
        <div id="quiz-question-text" class="question-title">Yükleniyor...</div>
        
        <div id="quiz-options-wrapper" class="options-container"></div>
        <div id="quiz-match-wrapper" class="match-container" style="display: none;"></div>
        <div id="quiz-input-wrapper" class="input-area" style="display: none;">
            <textarea id="quiz-text-input" placeholder="Cevabını buraya nakşet..."></textarea>
            <button class="btn-green" onclick="checkInputAnswer()">Kararımı Verdim</button>
        </div>
    </div>

    <!-- 5. BAŞARI EKRANI -->
    <div id="screen-success" class="screen">
        <div style="font-size: 6rem; margin: 20px 0; animation: bounce 1s infinite alternate;">🐢</div>
        <h2 id="success-compliment" style="color: var(--primary); font-weight: 900;">Bileğine Kuvvet!</h2>
        <p style="color: var(--text); font-weight: 600; text-align: center; margin-bottom: 30px;">Kayı Obası seninle gurur duyuyor.</p>
        <button class="btn-green" id="success-next-btn" onclick="advanceAfterSuccess()">Sıradaki Bölüme Geç</button>
    </div>
</div>

<script>
    // 21 BÖLÜMLÜK DEV MÜFREDAT
    const LEVEL_DATA = [
        // --- GEÇMİŞ ZAMAN (2 BÖLÜM) ---
        {
            title: "Geçmiş Zaman 1: 'İdi'",
            questions: [
                { type: "teaching", text: "Bizim obada geçmiş zaman ekleri (-dı, -di) kelimenin sonuna yapışmaz! Kelimeyi söyler, ardından 'idi' deriz.\n\nÖrnek:\nGüzeldi ❌\nGüzel idi ✅" },
                { type: "choice", q: "'O çok cesurdu' cümlesinin destansı ve doğru söylenişi nedir?", a: ["Yüreği pek cesur idi", "Korkusuzdu", "Cesurdu derler"], kor: 0 },
                { type: "match", q: "Modern kelimeleri, destansı halleriyle eşleştir:", pairs: [{m:"Nasılsın", o:"Ahvalin nicedir"}, {m:"Soğuktu", o:"Soğuk idi"}, {m:"Söyledi", o:"Söylemiş idi"}] },
                { type: "input", q: "Kendin dene: 'Hava çok soğuktu' cümlesini (idi kullanarak) yaz.", keywords: ["idi", "soğuk idi"], exact: "Hava çok soğuk idi" }
            ]
        },
        {
            title: "Geçmiş Zaman 2: Fiiller",
            questions: [
                { type: "teaching", text: "Fiillerde de durum aynıdır. Geldi yerine 'Gelmiş idi', gördü yerine 'Görmüş idi' deriz." },
                { type: "choice", q: "'O buraları önceden görmüştü' nasıl söylenir?", a: ["O buraları önceden görmüş idi", "O buraları önceden gördü", "O buraları bilirdi"], kor: 0 },
                { type: "match", q: "Fiilleri eşleştir:", pairs: [{m:"Biliyordu", o:"Bilmiş idi"}, {m:"Duymuştu", o:"Duymuş idi"}, {m:"Okumuştu", o:"Okumuş idi"}] },
                { type: "input", q: "Kendin dene: 'O dün gelmişti' cümlesini kurala göre yaz.", keywords: ["gelmiş idi"], exact: "O dün gelmiş idi" }
            ]
        },

        // --- GENİŞ ZAMAN (3 BÖLÜM) ---
        {
            title: "Geniş Zaman 1: 'Durur'",
            questions: [
                { type: "teaching", text: "Şimdi de bildirme ekini (-tır, -tir, -dır) öğrenelim. Cümlenin sonuna 'durur' koyarız, manası kesindir!\n\nÖrnek:\nZordur ❌\nZor durur ✅" },
                { type: "match", q: "Kelimeleri birbirine bağla yiğidim:", pairs: [{m:"Önemlidir", o:"Mühim durur"}, {m:"Böyledir", o:"Böyle durur"}, {m:"Güzeldir", o:"Güzel durur"}] },
                { type: "input", q: "Kendin dene: 'Onun kılıcı keskindir' cümlesini 'durur' ile bitirerek yaz.", keywords: ["durur"], exact: "Onun kılıcı keskin durur" },
                { type: "choice", q: "Düşman pusu kurmuş. 'Burası tehlikelidir' demek için ne söylersin?", a: ["Bu alan tehlikeli durur", "Burası tuzaktır", "Tehlike var idi"], kor: 0 }
            ]
        },
        {
            title: "Geniş Zaman 2: Sıfatlar",
            questions: [
                { type: "teaching", text: "Sıfatları pekiştirmek için de 'durur' kullanırız. \n\nÖrnek:\nYücedir ❌ \nYüce durur ✅" },
                { type: "choice", q: "'Dağlar çok yüksektir' nasıl denir?", a: ["Dağlar pek ulu durur", "Dağlar çok yüksekti", "Dağlar büyük idi"], kor: 0 },
                { type: "match", q: "Sıfatları eşleştir:", pairs: [{m:"Büyüktür", o:"Ulu durur"}, {m:"İyidir", o:"Yahşi durur"}, {m:"Kötüdür", o:"Yaman durur"}] },
                { type: "input", q: "Kendin dene: 'Bu at hızlıdır' demek için ne dersin?", keywords: ["hızlı durur", "durur"], exact: "Bu at hızlı durur" }
            ]
        },
        {
            title: "Geniş Zaman 3: Hakikat",
            questions: [
                { type: "teaching", text: "Kesin gerçekleri söylerken 'durur' şaşmaz kuralımızdır.\n\nÖrnek:\nHaktır ❌ \nHak durur ✅" },
                { type: "match", q: "Gerçekleri eşleştir:", pairs: [{m:"Doğrudur", o:"Gerçek durur"}, {m:"Haktır", o:"Hak durur"}, {m:"Yanlıştır", o:"Batıl durur"}] },
                { type: "input", q: "Kendin dene: 'Sözümüz sözdür' cümlesini kurala göre yaz.", keywords: ["söz durur"], exact: "Sözümüz söz durur" }
            ]
        },

        // --- EMİRLER VE ZAMAN (4 BÖLÜM) ---
        {
            title: "Emirler 1: 'Eyle / İmdik'",
            questions: [
                { type: "teaching", text: "Bir işi yapmak için 'yap, et' demeyiz, 'eyle' deriz. 'Şimdi' kelimesi yerine ise 'İmdik' deriz!\n\nÖrnek:\nŞimdi yap ❌\nİmdik eyle ✅" },
                { type: "match", q: "Zaman ve eylem eşleştirmelerini tamamla:", pairs: [{m:"Şimdi", o:"İmdik"}, {m:"Affet", o:"Helal eyle"}, {m:"Dikkat et", o:"Dikkat eyle"}] },
                { type: "choice", q: "Birinden hakkını helal etmesini nasıl istersin?", a: ["Hakkını helal eyle", "Beni affet", "Kusura bakma idi"], kor: 0 },
                { type: "input", q: "Kendin dene: 'Şimdi dikkat et' demek için obamızda ne dersin?", keywords: ["imdik", "eyle"], exact: "İmdik dikkat eyle" }
            ]
        },
        {
            title: "Emirler 2: 'Kıl'",
            questions: [
                { type: "teaching", text: "Sadece 'eyle' yetmez, bazen 'kıl' deriz. Özellikle manevi işlerde! Namaz kılmak, Dua kılmak gibi." },
                { type: "choice", q: "'Allah'a dua et' cümlesi obada nasıl yankılanır?", a: ["Allah'a dua kıl", "Allah'a dua eyle", "Allah'a yalvar durur"], kor: 0 },
                { type: "match", q: "Doğru emirleri seç:", pairs: [{m:"Yardım et", o:"Medet kıl"}, {m:"Merhamet et", o:"Rahim kıl"}, {m:"Namaz kıl", o:"Namaz kıl"}] },
                { type: "input", q: "Kendin dene: 'Bana yardım et' demek için 'kıl' kullan.", keywords: ["kıl", "medet"], exact: "Bana medet kıl" }
            ]
        },
        {
            title: "Zaman: Günler",
            questions: [
                { type: "teaching", text: "'Bugün', 'Yarın', 'Dün' kelimelerini destansı yapalım!\n\nYarın ❌ Yarınki gün ✅\nDün ❌ Dünki gün (veya Bıldır) ✅" },
                { type: "match", q: "Zamanları eşleştir:", pairs: [{m:"Yarın", o:"Yarınki gün"}, {m:"Dün", o:"Dünki gün"}, {m:"Geçen Yıl", o:"Bıldır"}] },
                { type: "choice", q: "'Yarın görüşürüz' nasıl denir?", a: ["Yarınki gün görüşürüz", "Yarın görüşürüz", "Yarınki gün görüştük idi"], kor: 0 }
            ]
        },
        {
            title: "Zaman ve Emirler (Karma)",
            questions: [
                { type: "teaching", text: "Öğrendiklerini birleştirme vakti! Zamanı ve emri aynı anda ver." },
                { type: "input", q: "Kendin dene: 'Yarın yardım et' demek için ne dersin?", keywords: ["yarınki", "kıl", "medet"], exact: "Yarınki gün medet kıl" },
                { type: "match", q: "Zamanları eşleştir:", pairs: [{m:"Şimdi yap", o:"İmdik eyle"}, {m:"Yarın gel", o:"Yarınki gün gel"}, {m:"Dün geldi", o:"Dünki gün gelmiş idi"}] }
            ]
        },

        // --- CENK VE MEYDAN (3 BÖLÜM) ---
        {
            title: "Cenk 1: Meydan",
            questions: [
                { type: "teaching", text: "Savaş = Cenk\nAsker = Alp / Nöker\nDüşman = Kefere / Gafil" },
                { type: "match", q: "Savaş terimlerini eşleştir:", pairs: [{m:"Asker", o:"Alp"}, {m:"Savaş", o:"Cenk"}, {m:"Düşman", o:"Gafil"}] },
                { type: "choice", q: "Obamızın yiğitlerine cenk meydanında ne denir?", a: ["Alp", "Silahşör", "Asker"], kor: 0 }
            ]
        },
        {
            title: "Cenk 2: Pusatlar",
            questions: [
                { type: "teaching", text: "Cenk aletlerine genel olarak 'Pusat' denir. Ok, yay, kılıç, kalkan, gürz... Pusatını kuşan!" },
                { type: "match", q: "Silahları eşleştir:", pairs: [{m:"Kılıç", o:"Kılıç"}, {m:"Zırh", o:"Cevşen"}, {m:"Savaş Baltası", o:"Teber"}] },
                { type: "input", q: "Kendin dene: Askerlerine 'Silahlarını al' emrini destansı ver.", keywords: ["pusat", "kuşan"], exact: "Pusatlarını kuşan" }
            ]
        },
        {
            title: "Cenk 3: Taktik",
            questions: [
                { type: "teaching", text: "Akın (saldırı), Pusu (tuzak), Tuğ (sancak).\nCenk meydanında akıl da lazımdır!" },
                { type: "choice", q: "Düşmanın pusu kurduğunu nasıl söylersin?", a: ["Gafil pusu kurmuş durur", "Kötüler tuzak kurdu", "Düşman bekler idi"], kor: 0 },
                { type: "match", q: "Taktikleri eşleştir:", pairs: [{m:"Saldırı", o:"Akın"}, {m:"Bayrak", o:"Tuğ"}, {m:"Komutan", o:"Başbuğ"}] }
            ]
        },

        // --- 12 BÖLÜMDEN SONRA AÇILANLAR (GÜNLÜK HAYAT - 3 BÖLÜM) ---
        {
            title: "Günlük Hayat 1: Selam",
            questions: [
                { type: "teaching", text: "'Merhaba' yerine 'Esenlikler' veya 'Esen misin?' deriz. Durum sormak için 'Ahvalin nicedir?' deriz." },
                { type: "match", q: "Selamlaşmaları eşleştir:", pairs: [{m:"Merhaba", o:"Esenlikler"}, {m:"Nasılsın", o:"Ahvalin nicedir"}, {m:"İyiyim", o:"Yahşiyim"}] },
                { type: "input", q: "Kendin dene: Birine merhaba demek için ne dersin?", keywords: ["esenlikler", "esen"], exact: "Esenlikler" }
            ]
        },
        {
            title: "Günlük Hayat 2: Aş ve Toy",
            questions: [
                { type: "teaching", text: "Yemek için 'Aş', şenlik ve ziyafet için 'Toy', içecek için 'Kımız' veya 'Şerbet' deriz." },
                { type: "choice", q: "'Akşam yemeği hazır' nasıl denir?", a: ["Akşam aşı hazır durur", "Akşam yemeği oldu", "Yemek zamanıdır"], kor: 0 },
                { type: "match", q: "Yemekleri eşleştir:", pairs: [{m:"Yemek", o:"Aş"}, {m:"Ziyafet", o:"Toy"}, {m:"İçecek", o:"Kımız"}] }
            ]
        },
        {
            title: "Günlük Hayat 3: Boy ve Oba",
            questions: [
                { type: "teaching", text: "Aileye 'Soy', çadırların toplandığı yere 'Oba', liderimize 'Bey', eşine 'Hatun' deriz." },
                { type: "match", q: "Kişileri eşleştir:", pairs: [{m:"Köy", o:"Oba"}, {m:"Lider", o:"Bey"}, {m:"Kadın", o:"Hatun"}] },
                { type: "input", q: "Kendin dene: 'Köyümüz çok büyüktür' demek için ne dersin?", keywords: ["oba", "ulu"], exact: "Obamız pek ulu durur" }
            ]
        },

        // --- DOĞA VE ÇEVRE (3 BÖLÜM) ---
        {
            title: "Doğa 1: Gök ve Yer",
            questions: [
                { type: "teaching", text: "Doğa ulu durur! Gökyüzüne 'Gök', yeryüzüne 'Yer' veya dünyamıza 'Acun' deriz." },
                { type: "match", q: "Dünyayı tanıyalım:", pairs: [{m:"Dünya", o:"Acun"}, {m:"Gökyüzü", o:"Gök"}, {m:"Toprak", o:"Yer"}] },
                { type: "choice", q: "'Dünya çok büyüktür' nasıl söylenir?", a: ["Acun pek ulu durur", "Dünya ulu idi", "Yer geniştir"], kor: 0 }
            ]
        },
        {
            title: "Doğa 2: Hayvanlar",
            questions: [
                { type: "teaching", text: "Kurt sıradan bir hayvan değildir, o 'Börü'dür! Atımız binek ve yoldaşımızdır. Köpeğe 'İt' denir." },
                { type: "match", q: "Hayvanları eşleştir:", pairs: [{m:"Kurt", o:"Börü"}, {m:"Köpek", o:"İt"}, {m:"At", o:"Binek"}] },
                { type: "input", q: "Kendin dene: 'Ormanda kurt gördüm' demek için (kurt yerine) ne yazarsın?", keywords: ["börü"], exact: "Ormanda börü gördüm" }
            ]
        },
        {
            title: "Doğa 3: Yönler",
            questions: [
                { type: "teaching", text: "Yönleri güneşe göre söyleriz. Doğuya 'Gündoğusu', batıya 'Günbatısı' deriz." },
                { type: "match", q: "Yönleri eşleştir:", pairs: [{m:"Doğu", o:"Gündoğusu"}, {m:"Batı", o:"Günbatısı"}, {m:"Kuzey", o:"Kuzey"}, {m:"Güney", o:"Güney"}] },
                { type: "input", q: "Kendin dene: 'Güneş doğudan doğar' cümlesini yönlere göre çevir.", keywords: ["gündoğusu", "gün"], exact: "Gün gündoğusundan doğar" }
            ]
        },

        // --- HİSSİYAT (3 BÖLÜM) ---
        {
            title: "Hissiyat 1: Yürek",
            questions: [
                { type: "teaching", text: "Kalp yerine 'Yürek', aşk yerine 'Sevda' veya 'Gönül vermek' deriz. Acı ise 'Keder' veya 'Dert'tir." },
                { type: "match", q: "Duyguları eşleştir:", pairs: [{m:"Kalp", o:"Yürek"}, {m:"Aşk", o:"Sevda"}, {m:"Acı", o:"Keder"}] },
                { type: "choice", q: "'Kalbim ağrıyor' yerine destansı ne dersin?", a: ["Yüreğim dertli durur", "Kalbim sızlar idi", "Canım yanar"], kor: 0 }
            ]
        },
        {
            title: "Hissiyat 2: Akıl ve Us",
            questions: [
                { type: "teaching", text: "Akıllı kişiye 'Bilge' veya 'Uslu' deriz. Akıl kelimesinin aslı 'Us'tur." },
                { type: "match", q: "Aklı eşleştir:", pairs: [{m:"Akıllı", o:"Uslu"}, {m:"Alim/Zeki", o:"Bilge"}, {m:"Akıl", o:"Us"}] },
                { type: "input", q: "Kendin dene: 'O çok akıllıdır' demek için ne dersin?", keywords: ["uslu", "durur"], exact: "O pek uslu durur" }
            ]
        },
        {
            title: "Hissiyat 3: Öfke ve Yılgı",
            questions: [
                { type: "teaching", text: "Düşmana öfkeleniriz! Korku yerine 'Yılgı', cesur savaşçıya 'Batur' veya 'Bahadır' deriz." },
                { type: "match", q: "Hissi halleri eşleştir:", pairs: [{m:"Cesur", o:"Batur"}, {m:"Korku", o:"Yılgı"}, {m:"Öfke", o:"Hiddet"}] },
                { type: "choice", q: "'Ordumuz korkusuzdur' nasıl denir?", a: ["Ordumuz yılgı bilmez durur", "Ordumuz korkmaz idi", "Alpler korkusuzdur"], kor: 0 }
            ]
        }
    ];

    let appState = {
        userName: "", platform: "", currentLevel: 0,
        activeQuizLevel: 0, activeQuestionIdx: 0, lives: 5, streak: 0, 
        lastLifeTimestamp: null, promptedPWA: false
    };

    let currentVoiceText = "";
    let lifeTimerInterval = null;
    let matchState = { leftNode: null, rightNode: null, matchedCount: 0, totalPairs: 0 };

    window.addEventListener('load', () => {
        const storedUser = localStorage.getItem('qwertzio_user_data');
        if (storedUser) {
            appState = JSON.parse(storedUser);
            // Mevcut kullanıcılar için yeni bölüm uyumluluğu kontrolü
            if(appState.currentLevel >= LEVEL_DATA.length) appState.currentLevel = LEVEL_DATA.length - 1;
            loadDashboard();
        }
        initLifeTimerLogic();
    });

    function saveProgress() {
        localStorage.setItem('qwertzio_user_data', JSON.stringify(appState));
    }

    function selectPlatform(plat) {
        document.querySelectorAll('.platform-btn').forEach(btn => btn.classList.remove('selected'));
        document.getElementById(`btn-${plat}`).classList.add('selected');
        appState.platform = plat;
    }

    function handleAuth() {
        const name = document.getElementById('reg-name').value.trim();
        if (!name) { alert("Obaya girmek için adını bahşetmelisin!"); return; }
        if (!appState.platform) { alert("Nereden katıldığını seçmelisin (Web/Uygulama)!"); return; }

        appState.userName = name.split(' ')[0];
        appState.currentLevel = 0; appState.lives = 5; 
        appState.streak = 0; appState.lastLifeTimestamp = null; appState.promptedPWA = false;
        saveProgress();
        
        showPersistentToast(`Kayı Obasına hoş geldin, ${appState.userName} Bey!`, "⛺");
        loadDashboard();
    }

    function loadDashboard() {
        document.getElementById('welcome-banner').innerText = `Sefalar Getirdin, ${appState.userName}!`;
        document.getElementById('user-display-level').innerText = `B. ${appState.currentLevel + 1}`;
        document.getElementById('streak-count').innerText = appState.streak;
        document.getElementById('lives-count').innerText = appState.lives;
        
        document.getElementById('screen-register').classList.remove('active');
        document.getElementById('screen-dashboard').classList.add('active');
        renderPathNodes();
    }

    function renderPathNodes() {
        const container = document.getElementById('nodes-path-container');
        container.innerHTML = "";
        for (let i = 0; i < LEVEL_DATA.length; i++) {
            const node = document.createElement('div');
            const isUnlocked = i <= appState.currentLevel;
            node.className = `level-node ${isUnlocked ? 'unlocked' : 'locked'}`;
            node.innerHTML = isUnlocked ? (i + 1) : "🔒";
            
            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip';
            tooltip.innerText = LEVEL_DATA[i].title;
            node.appendChild(tooltip);

            if (isUnlocked) node.onclick = () => launchQuiz(i);
            else node.onclick = () => showPersistentToast(`🔒 Önceki bölümleri bitirmelisin!`);
            container.appendChild(node);
        }
    }

    function showPersistentToast(text, emoji = "⚔️") {
        const area = document.getElementById('notification-area');
        const toast = document.createElement('div');
        toast.className = 'persistent-toast';
        toast.innerHTML = `<span>${emoji}</span> <span>${text}</span>`;
        area.prepend(toast);
        setTimeout(() => {
            toast.classList.add('faded');
            setTimeout(() => { if(toast.parentElement) toast.remove(); }, 500);
        }, 3500);
    }

    function speakSultan(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            utterance.pitch = 1.0; utterance.rate = 1.0; 
            window.speechSynthesis.speak(utterance);
        }
    }

    function launchQuiz(levelIdx) {
        if (appState.lives <= 0) { showPersistentToast("⚠️ Canın yok! Biraz dinlen yiğidim.", "❤️"); return; }
        appState.activeQuizLevel = levelIdx; appState.activeQuestionIdx = 0;
        document.getElementById('back-arrow').style.display = 'block';
        document.getElementById('user-display-level').innerText = `B. ${levelIdx + 1}`;
        processNextStep();
    }

    function processNextStep() {
        const lvl = LEVEL_DATA[appState.activeQuizLevel];
        if(appState.activeQuestionIdx >= lvl.questions.length) {
            handleLevelCompletion();
            return;
        }
        
        const qData = lvl.questions[appState.activeQuestionIdx];
        if(qData.type === 'teaching') {
            document.getElementById('teaching-content-text').innerText = qData.text;
            switchScreen('screen-teaching');
            speakSultan(qData.text.split('\n')[0]);
        } else {
            loadQuestion(qData, lvl.questions.length);
        }
    }

    function replayTeachingVoice() {
        const qData = LEVEL_DATA[appState.activeQuizLevel].questions[appState.activeQuestionIdx];
        speakSultan(qData.text);
    }

    function proceedToQuestion() {
        window.speechSynthesis.cancel();
        appState.activeQuestionIdx++;
        processNextStep();
    }

    function loadQuestion(qData, totalQ) {
        switchScreen('screen-quiz');
        document.getElementById('quiz-progress-bar').style.width = `${(appState.activeQuestionIdx / totalQ) * 100}%`;
        document.getElementById('quiz-q-counter').innerText = `${appState.activeQuestionIdx}/${totalQ}`;
        document.getElementById('quiz-question-text').innerText = qData.q;
        currentVoiceText = qData.q;
        speakSultan(currentVoiceText);

        document.getElementById('quiz-options-wrapper').style.display = 'none';
        document.getElementById('quiz-match-wrapper').style.display = 'none';
        document.getElementById('quiz-input-wrapper').style.display = 'none';

        if(qData.type === 'choice') {
            document.getElementById('quiz-options-wrapper').style.display = 'flex';
            renderChoice(qData);
        } else if (qData.type === 'match') {
            document.getElementById('quiz-match-wrapper').style.display = 'flex';
            renderMatch(qData);
        } else if (qData.type === 'input') {
            document.getElementById('quiz-input-wrapper').style.display = 'flex';
            document.getElementById('quiz-text-input').value = "";
        }
    }

    function replayQuestionVoice() { speakSultan(currentVoiceText); }

    function renderChoice(qData) {
        let optionsObj = qData.a.map((text, idx) => ({ text, isCorrect: idx === qData.kor }));
        optionsObj.sort(() => Math.random() - 0.5);
        const wrapper = document.getElementById('quiz-options-wrapper');
        wrapper.innerHTML = "";
        optionsObj.forEach(opt => {
            const card = document.createElement('div');
            card.className = 'option-card'; card.innerText = opt.text;
            card.onclick = () => handleAnswer(opt.isCorrect);
            wrapper.appendChild(card);
        });
    }

    function checkInputAnswer() {
        const userInput = document.getElementById('quiz-text-input').value.trim().toLowerCase();
        if(!userInput) { showPersistentToast("Bir şeyler karalamalısın!"); return; }
        
        const qData = LEVEL_DATA[appState.activeQuizLevel].questions[appState.activeQuestionIdx];
        const hasKeyword = qData.keywords.some(kw => userInput.includes(kw.toLowerCase()));
        
        if (hasKeyword) {
            if (userInput === qData.exact.toLowerCase()) {
                showPersistentToast("Mükemmel kelam! Birebir yazdın.", "✨");
            } else {
                showPersistentToast("Cümlen benzedi, daha iyisini yapabilirdin ama yürü yiğidim!", "👍");
            }
            handleAnswer(true, true);
        } else {
            showPersistentToast("Yanlış kelam eyledin! Tekrar dene. (Sana cevabı söylemem!)", "❌");
            handleAnswer(false, true);
        }
    }

    function renderMatch(qData) {
        matchState = { leftNode: null, rightNode: null, matchedCount: 0, totalPairs: qData.pairs.length };
        const wrapper = document.getElementById('quiz-match-wrapper');
        wrapper.innerHTML = "<div class='match-col' id='match-col-left'></div><div class='match-col' id='match-col-right'></div>";
        
        let lefts = qData.pairs.map((p, i) => ({text: p.m, id: i, side: 'L'})).sort(() => Math.random() - 0.5);
        let rights = qData.pairs.map((p, i) => ({text: p.o, id: i, side: 'R'})).sort(() => Math.random() - 0.5);

        const colL = document.getElementById('match-col-left');
        const colR = document.getElementById('match-col-right');

        lefts.forEach(item => colL.appendChild(createMatchBtn(item)));
        rights.forEach(item => colR.appendChild(createMatchBtn(item)));
    }

    function createMatchBtn(item) {
        const btn = document.createElement('button');
        btn.className = 'match-btn'; btn.innerText = item.text;
        btn.onclick = () => onMatchClick(btn, item);
        return btn;
    }

    function onMatchClick(btn, item) {
        if(btn.classList.contains('matched')) return;
        
        if(item.side === 'L') {
            if(matchState.leftNode) matchState.leftNode.btn.classList.remove('selected');
            matchState.leftNode = {btn, id: item.id};
            btn.classList.add('selected');
        } else {
            if(matchState.rightNode) matchState.rightNode.btn.classList.remove('selected');
            matchState.rightNode = {btn, id: item.id};
            btn.classList.add('selected');
        }

        if(matchState.leftNode && matchState.rightNode) {
            if(matchState.leftNode.id === matchState.rightNode.id) {
                matchState.leftNode.btn.classList.add('matched');
                matchState.rightNode.btn.classList.add('matched');
                matchState.leftNode.btn.classList.remove('selected');
                matchState.rightNode.btn.classList.remove('selected');
                matchState.matchedCount++;
                matchState.leftNode = null; matchState.rightNode = null;
                
                if(matchState.matchedCount === matchState.totalPairs) {
                    setTimeout(() => handleAnswer(true), 500);
                }
            } else {
                let lBtn = matchState.leftNode.btn; let rBtn = matchState.rightNode.btn;
                lBtn.classList.remove('selected'); rBtn.classList.remove('selected');
                lBtn.classList.add('error'); rBtn.classList.add('error');
                matchState.leftNode = null; matchState.rightNode = null;
                
                setTimeout(() => { lBtn.classList.remove('error'); rBtn.classList.remove('error'); }, 400);
                handleAnswer(false, true);
            }
        }
    }

    function handleAnswer(isCorrect, customMessage = false) {
        window.speechSynthesis.cancel();
        
        if (isCorrect) {
            if(!customMessage) showPersistentToast("Doğru bildin! Yürü yiğidim.", "✨"); 
            appState.activeQuestionIdx++;
            setTimeout(processNextStep, 800);
        } else {
            appState.lives--; if (appState.lives < 0) appState.lives = 0;
            document.getElementById('lives-count').innerText = appState.lives;
            if (appState.lives < 5 && !appState.lastLifeTimestamp) appState.lastLifeTimestamp = Date.now();
            saveProgress();
            
            if(!customMessage) showPersistentToast("Yanlış! Bir can eksildi.", "😢");

            if (appState.lives <= 0) {
                setTimeout(() => { goBackToDashboard(); showPersistentToast("Canın bitti! 30 Saniye bekle.", "❤️"); }, 1000);
            }
        }
    }

    function handleLevelCompletion() {
        appState.streak++; document.getElementById('streak-count').innerText = appState.streak;
        
        // Eğer bitirilen seviye en son açılan seviyeyse yenisini aç (toplam sınırına kadar)
        if (appState.activeQuizLevel === appState.currentLevel && appState.currentLevel < LEVEL_DATA.length - 1) {
            appState.currentLevel++;
        }
        
        saveProgress(); renderPathNodes();

        speakSultan("Bileğine kuvvet! Toyu başarıyla geçtin.");
        
        if (appState.activeQuizLevel === 0 && appState.platform === 'web' && !appState.promptedPWA) {
            setTimeout(() => {
                if(confirm("Daha hızlı girmek için Qwertzio'yu ana ekrana eklemek ister misin?")) {
                    alert("Harika! Tarayıcının sağ üstteki menüsünden 'Ana Ekrana Ekle' (Add to Home Screen) seçeneğine dokunarak kendi obanı kurabilirsin!");
                }
                appState.promptedPWA = true;
                saveProgress();
            }, 1000);
        }

        switchScreen('screen-success');
    }

    function advanceAfterSuccess() { 
        window.speechSynthesis.cancel();
        goBackToDashboard(); 
    }

    function goBackToDashboard() {
        window.speechSynthesis.cancel();
        document.getElementById('back-arrow').style.display = 'none';
        document.getElementById('user-display-level').innerText = `B. ${appState.currentLevel + 1}`;
        switchScreen('screen-dashboard');
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function initLifeTimerLogic() {
        if (lifeTimerInterval) clearInterval(lifeTimerInterval);
        lifeTimerInterval = setInterval(() => {
            if (appState.lives < 5 && appState.lastLifeTimestamp) {
                const elapsedMs = Date.now() - appState.lastLifeTimestamp;
                const cooldownMs = 30 * 1000; 
                
                if (elapsedMs >= cooldownMs) {
                    appState.lives++; document.getElementById('lives-count').innerText = appState.lives;
                    if (appState.lives >= 5) {
                        appState.lastLifeTimestamp = null;
                        document.getElementById('dashboard-timer-warning').style.display = 'none';
                        showPersistentToast("❤️ Canın tamamen doldu!", "✨");
                    } else {
                        appState.lastLifeTimestamp = Date.now();
                    }
                    saveProgress();
                } else {
                    const remainingSec = Math.ceil((cooldownMs - elapsedMs) / 1000);
                    document.getElementById('dashboard-timer-warning').style.display = 'block';
                    document.getElementById('dashboard-time-left').innerText = `00:${remainingSec < 10 ? '0' : ''}${remainingSec}`;
                }
            } else { document.getElementById('dashboard-timer-warning').style.display = 'none'; }
        }, 1000);
    }
</script>
