<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eski Türkçe Dil Öğrenimi</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f4ecd8; /* Eski parşömen kağıdı rengi */
            color: #3e2723;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: #fff8e7;
            border: 2px solid #8d6e63;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            width: 350px;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.15);
            margin-top: 80px;
        }

        h1 {
            font-size: 2.5em;
            margin: 10px 0;
            letter-spacing: 2px;
            color: #4e342e;
        }

        .runic {
            font-size: 1.2em;
            color: #795548;
            margin-bottom: 15px;
            font-style: italic;
        }

        button {
            background: #5d4037;
            color: white;
            font-size: 1em;
            font-family: inherit;
            border: none;
            padding: 12px 25px;
            margin-top: 25px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        button:hover {
            background: #3e2723;
        }

        /* Bildirimlerin Birikeceği Sabit Alan */
        #notification-area {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 90vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Özel Kaydırma Çubuğu (Scrollbar) */
        #notification-area::-webkit-scrollbar { width: 6px; }
        #notification-area::-webkit-scrollbar-thumb { background: #8d6e63; border-radius: 10px; }

        /* Bildirim Tasarımı */
        .notification {
            background: #d7ccc8;
            border-left: 6px solid #5d4037;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
            font-size: 0.9em;
            transition: opacity 1s ease-in-out, transform 0.3s;
        }

        /* BİLDİRİMLER KOMPLE KAYBOLMUYOR: Sadece soluklaşıyor */
        .notification.faded {
            opacity: 0.4;
        }

        /* Üzerine gelince tekrar görünür oluyorlar */
        .notification.faded:hover {
            opacity: 1;
            transform: scale(1.02);
            cursor: default;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Eski Türkçe Sözlük</h2>
        <div class="runic">Göktürkçe / Uygurca</div>
        <h1 id="word">BODUN</h1>
        <p id="meaning">Anlamı: Halk, Millet</p>
        <button onclick="learnNewWord()">Yeni Kelime Çek</button>
    </div>

    <!-- Bildirimlerin asla kaybolmayıp birikeceği konteyner -->
    <div id="notification-area"></div>

    <script>
        // Eski Türkçe kelime havuzu
        const words = [
            { word: "TENGİRİ", meaning: "Gökyüzü, Tanrı" },
            { word: "SÜ", meaning: "Asker, Ordu" },
            { word: "YALAVAÇ", meaning: "Elçi, Haberci" },
            { word: "TİGİN", meaning: "Prens, Hükümdar Oğlu" },
            { word: "BİTİG", meaning: "Yazı, Kitap, Belge" },
            { word: "KAM", meaning: "Şaman, Büyücü, Doktor" },
            { word: "YARLIG", meaning: "Emir, Ferman" },
            { word: "TUDUN", meaning: "Vergi Memuru, Vali" }
        ];

        function learnNewWord() {
            // Rastgele kelime seçimi
            const randomObj = words[Math.floor(Math.random() * words.length)];

            // Ana kartı güncelle
            document.getElementById('word').innerText = randomObj.word;
            document.getElementById('meaning').innerText = "Anlamı: " + randomObj.meaning;

            // Kaybolmayan bildirim oluştur
            createPersistentNotification(`Yeni Kelime Eklendi: ${randomObj.word} - ${randomObj.meaning}`);
        }

        function createPersistentNotification(message) {
            const area = document.getElementById('notification-area');
            
            // Yeni bildirim elementi oluştur
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.innerHTML = `<strong>Kayıt:</strong> ${message}`;

            // En üste ekle (yeni öğrenilen hep üstte çıksın)
            area.prepend(notif);

            // 3 Saniye sonra DOM'dan SİLME, sadece 'faded' class'ı ekleyip soluklaştır
            setTimeout(() => {
                notif.classList.add('faded');
            }, 3000);
        }
    </script>

</body>
</html>
